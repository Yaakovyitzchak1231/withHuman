name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubicloud-standard-4
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the frontend build stage in the Dockerfile.
          node-version: 25
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Verify
        # -short skips the integration tests that boot embedded PostgreSQL
        # and Temporal; the archives they download make them too slow for
        # every pull request.
        env:
          AAP_MODULE_TOKEN: ${{ secrets.AAP_MODULE_TOKEN }}
        run: sh scripts/private-go-modules.sh make verify GOTESTFLAGS=-short

      - name: CLI race and real provider integration
        env:
          AAP_MODULE_TOKEN: ${{ secrets.AAP_MODULE_TOKEN }}
        run: |
          sh scripts/private-go-modules.sh go test -race ./internal/cli/...
          sh scripts/private-go-modules.sh go test -race ./internal/httpapi -run TestAAPLibraryAgainstProvider
          sh scripts/private-go-modules.sh go test ./internal/postgres -run 'TestStoreAgainstRealPostgres|TestPipelineSuspensions'

      - name: Cross-build embedded CLI
        env:
          AAP_MODULE_TOKEN: ${{ secrets.AAP_MODULE_TOKEN }}
        run: sh scripts/private-go-modules.sh sh scripts/check-cli-builds.sh

  image-build:
    runs-on: ubicloud-standard-4
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # amd64 only: PR builds exist to catch a broken Dockerfile, and
      # multi-arch would roughly double the build time. The cache scope is
      # separate from the release workflow's so PR builds never pollute
      # release caches.
      - name: Build bundle image
        uses: docker/build-push-action@v6
        with:
          secrets: |
            github_token=${{ secrets.AAP_MODULE_TOKEN }}
          context: .
          target: bundle
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=ci-bundle
          cache-to: type=gha,scope=ci-bundle,mode=max
